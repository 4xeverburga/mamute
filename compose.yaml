# Mamute — eval environment.
#
# This file lives IN the sample: it is part of the pinned commit, and the
# bench repo no longer knows how to start anything. `make pin` in the bench
# repo points SAMPLE.commit_sha at a commit that contains this file.
#
# One host port is exported by the harness for every run, so concurrent
# runs never collide:
#   BENCH_HTTP_PORT   host port for the app   (default 8090)
#
# The database publishes nothing: the harness reaches it with
# `docker compose exec db ...`, so `data` really is the only way in.
#
# Credentials come from `.env`, which is tracked on purpose: its values are
# synthetic and deterministic, so a bare checkout boots unchanged
# (template: .env.example).
#
# Shape (bench repo: templates/compose.template.yaml):
#   api    front <-> back
#   data   back <-> db
# At the pin `front` is on BOTH: the app is still server-rendered and reads
# the database directly. Dropping `data` from `front` is the task, so do not
# tidy it away here.
name: mamute

networks:
  api: {}
  data: {}

services:
  db:
    image: mysql:5.7
    networks:
      - data
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  front:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - api
      - data        # the task: remove this once the data side is extracted
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BENCH_HTTP_PORT:-8090}:8080"
    volumes:
      - ./entrypoint.sh:/workspace/entrypoint.sh:ro
    environment:
      # fail fast instead of booting with empty credentials
      MAMUTE_ADMIN_USER: ${MAMUTE_ADMIN_USER:?set .env (cp from .env.example)}
      MAMUTE_ADMIN_PASSWORD: ${MAMUTE_ADMIN_PASSWORD:?set .env (cp from .env.example)}
      MAMUTE_PUBLIC_URL: ${MAMUTE_PUBLIC_URL:-http://localhost:${BENCH_HTTP_PORT:-8090}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 240s

  # One-shot: rotates the first-boot seeded moderator to the .env admin
  # credentials. Exits 0; `compose up --wait` treats a successful exit as done.
  bootstrap:
    image: mysql:5.7
    networks:
      - data
    depends_on:
      front:
        condition: service_healthy
    volumes:
      - ./bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["bash", "/bootstrap.sh"]
    environment:
      MAMUTE_ADMIN_USER: ${MAMUTE_ADMIN_USER:?set .env (cp from .env.example)}
      MAMUTE_ADMIN_PASSWORD: ${MAMUTE_ADMIN_PASSWORD:?set .env (cp from .env.example)}

volumes:
  db-data:
